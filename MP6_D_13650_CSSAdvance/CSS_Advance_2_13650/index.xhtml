<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Strict//EN"
 "http://www.w3.org/TR/xhtml1/DTD/xhtml1-strict.dtd">
<html xmlns="http://www.w3.org/1999/xhtml" xml:lang="id" lang="id">
<head>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
    <title>Formulir Seleksi Beasiswa dan Pelatihan</title>
    <link rel="stylesheet" type="text/css" href="style.css" />
</head>
<body>
    <h1>Formulir Seleksi Beasiswa dan Pelatihan</h1>
    <form action="" method="post" enctype="multipart/form-data">
        <table cellspacing="4" cellpadding="4" border="1" style="border-collapse:collapse; width:100%;">
            <tr>
                <td style="width:32%;">
                    <label for="namalengkap"><strong>Nama Lengkap</strong></label>
                </td>
                <td>
                    <input type="text" id="namalengkap" name="namalengkap" size="30" />
                </td>
            </tr>
            <tr>
                <td style="width:32%;">
                    <label for="universitas"><strong>Asal Universitas</strong></label>
                </td>
                <td>
                    <input type="text" id="universitas" name="universitas" size="30" />
                </td>
            </tr>
            <tr>
                <td style="width:32%;">
                    <label for="prodi"><strong>Program Studi</strong></label>
                </td>
                <td>
                    <select id="prodi" name="prodi">
                        <option>Informatika</option>
                        <option>Sistem Informasi</option>
                        <option>Teknik Industri</option>
                    </select>
                </td>
            </tr>
            <tr>
                <td style="width:32%;">
                    <strong>Jenis Kelamin</strong>
                </td>
                <td>
                    <input type="radio" id="lakilaki" name="jeniskelamin" value="Laki-laki" />
                    <label for="lakilaki">Laki-laki</label>
                    <input type="radio" id="perempuan" name="jeniskelamin" value="Perempuan" />
                    <label for="perempuan">Perempuan</label>
                </td>
            </tr>
        </table>

        <br />

        <table cellspacing="4" cellpadding="4" border="1" style="border-collapse:collapse; width:100%;">
            <tr>
                <td style="width:32%;">
                    <strong>Kategori Jalur Seleksi</strong>
                </td>
                <td>
                    <input type="radio" id="seminar" name="jeniskegiatan" value="Seminar" />
                    <label for="seminar">Jalur Reguler</label>
                    <input type="radio" id="pelatihan" name="jeniskegiatan" value="Pelatihan" />
                    <label for="pelatihan">Jalur Prestasi Akademik</label>
                    <input type="radio" id="diskusi" name="jeniskegiatan" value="Diskusi" />
                    <label for="diskusi">Jalur Prestasi Non-Akademik</label>
                </td>
            </tr>
            <tr>
                <td style="width:32%; vertical-align:top;">
                    <strong>Pilihan Program Keahlian</strong>
                </td>
                <td>
                    <p style="margin: 0 0 5px 0;">
                        <input type="checkbox" id="teknologi" name="bidangminat" value="Teknologi" />
                        <label for="teknologi">Full-Stack Web Engineering</label>
                    </p>
                    <p style="margin: 0 0 5px 0;">
                        <input type="checkbox" id="organisasi" name="bidangminat" value="Organisasi" />
                        <label for="organisasi">Cyber Security Fundamentals</label>
                    </p>
                    <p style="margin: 0;">
                        <input type="checkbox" id="karier" name="bidangminat" value="Karier" />
                        <label for="karier">Digital Marketing</label>
                    </p>
                </td>
            </tr>
            <tr>
                <td style="width:32%;">
                    <label for="waktu"><strong>Sesi Waktu Pembelajaran</strong></label>
                </td>
                <td>
                    <select id="waktu" name="waktu">
                        <option>Sesi Pagi (08:00 - 12:00 WIB)</option>
                        <option>Sesi Siang (13:00 - 17:00 WIB)</option>
                        <option>Sesi Malam (19:00 - 21:30 WIB)</option>
                    </select>
                </td>
            </tr>
        </table>

        <br />

        <table cellspacing="4" cellpadding="4" border="1" style="border-collapse:collapse; width:100%;">
            <tr>
                <td style="width:32%; vertical-align:top;">
                    <label for="harapan"><strong>Harapan dan Motivasi Mengikuti Kegiatan</strong></label>
                </td>
                <td>
                    <textarea id="harapan" name="harapan" rows="6" cols="30"></textarea>
                </td>
            </tr>
            <tr>
                <td style="width:32%;">
                    <label for="berkas"><strong>Unggah Berkas Curriculum Vitae (CV)</strong></label>
                </td>
                <td>
                    <input type="file" id="berkas" name="berkas" accept="application/pdf, image/jpeg, image/png" />
                </td>
            </tr>
            <tr>
                <td colspan="2" style="text-align:center;">
                    <input type="submit" name="kirim" value="Kirim" />
                </td>
            </tr>
        </table>

    </form>
</body>
</html>
