<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xml:lang="id" lang="id">
<head>
  <meta http-equiv="Content-Type" content="application/xhtml+xml; charset=UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Masuk - PawTrack</title>
  <script type="text/javascript">
    //<![CDATA[
    try {
      var savedTheme = window.localStorage.getItem('pawtrack-theme');
      if (savedTheme === 'light' || savedTheme === 'dark') {
        document.documentElement.setAttribute('data-theme', savedTheme);
      }
    } catch (error) {}
    //]]>
  </script>
  <link rel="stylesheet" type="text/css" href="style.css?v=16" />
</head>
<body class="auth-page">
  <div class="auth-wrapper">
    <button type="button" class="theme-toggle theme-toggle-auth" id="theme-toggle" aria-label="Aktifkan tema gelap">&#x1F319; Tema gelap</button>
    <div class="auth-card card-glass auth-card-login">
      <section class="auth-panel auth-panel-warm auth-panel-video">
        <video class="auth-background-video" muted="muted" loop="loop" playsinline="playsinline" preload="metadata" aria-hidden="true">
          <source src="assets/login-cat.mp4" type="video/mp4" />
        </video>
        <div class="auth-video-overlay" aria-hidden="true"></div>
        <div class="auth-panel-video-content">
          <p class="auth-kicker">&#x1F43E; Komunitas Peduli Kucing Jalanan</p>
          <h1 class="auth-promo-title">Pantau &amp; Sayangi Kucing Sekitar Kita</h1>
        </div>
      </section>
      <section class="auth-form-panel">
        <a class="auth-brand" href="login.xhtml"><span class="brand-icon">&#x1F43E;</span><span><strong>PawTrack</strong><small>Stray Cat Tracker</small></span></a>
        <h2 class="auth-form-title">Masuk ke Sistem</h2>
        <div id="flash-area" class="flash-area"></div>
        <form action="login.php" method="post" id="form-login">
        <div class="form-group">
          <label class="form-label" for="username">Username</label>
          <input class="input-field" type="text" id="username" name="username" maxlength="50" placeholder="Masukkan username" autocomplete="username" required="required" />
        </div>
        <div class="form-group">
          <label class="form-label" for="password">Kata Sandi</label>
          <div class="password-field">
            <input class="input-field" type="password" id="password" name="password" minlength="6" placeholder="Minimal 6 karakter" autocomplete="current-password" required="required" />
            <button class="password-toggle" type="button" data-password-target="password" aria-label="Tampilkan kata sandi" aria-pressed="false">&#x1F441;</button>
          </div>
        </div>
        <button class="btn btn-primary btn-full" type="submit">&#x1F511; Masuk ke Sistem</button>
        </form>
        <p class="auth-footer">Belum memiliki akun relawan? <a href="register.xhtml" class="auth-link">Daftar Akun Baru &#x2192;</a></p>
      </section>
    </div>
  </div>
  <script type="text/javascript" src="script.js?v=12"></script>
</body>
</html>
